name: WakaTime Readme

on:
  schedule:
    # 每天午夜 12 點執行 (UTC)
    - cron: '0 0 * * *'
  # 允許手動觸發
  workflow_dispatch:

jobs:
  update-readme:
    name: Update Readme with WakaTime
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

